# Render blueprint. Point Render at this repository and it reads this file
# instead of asking you to fill a form.
#
#   render.com → New → Blueprint → connect the repo → Apply
#
# Two variables it will ask you for, because they are not in here and must not
# be: HANDSHAKE_ADMIN_EMAIL and the SMTP password.
services:
  - type: web
    name: handshake
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      # Generated by Render, different per service, never in the repository.
      - key: HANDSHAKE_SECRET_KEY
        generateValue: true

      # The account that gets created on the very first boot, because a fresh
      # database has no users and this product has no open registration — with
      # nothing here nobody can sign in at all. Leave the password unset and
      # one is generated and printed once to the deploy log.
      - key: HANDSHAKE_ADMIN_EMAIL
        sync: false
      - key: HANDSHAKE_ADMIN_PASSWORD
        sync: false

      # Render terminates TLS, so the session cookie can be marked Secure.
      - key: HANDSHAKE_HTTPS
        value: "1"

      # Mail. Without these the app writes .eml files into the container
      # instead of sending, which on a real deployment means nobody ever
      # receives an invitation or a password reset.
      - key: HANDSHAKE_SMTP_HOST
        value: smtp.gmail.com
      - key: HANDSHAKE_SMTP_PORT
        value: "587"
      - key: HANDSHAKE_SMTP_USER
        sync: false
      - key: HANDSHAKE_SMTP_PASSWORD
        sync: false
      - key: HANDSHAKE_MAIL_FROM
        sync: false

      # Deliberately absent: HANDSHAKE_DEMO_DATA. Setting it seeds accounts
      # whose passwords are in app.py, one of which is an administrator.
